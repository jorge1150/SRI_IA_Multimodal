# docker-compose.yml — VM de demo (ver docs/adr/0014-despliegue-cloud-azure.md)
#
# Uso local (Mac de Jorge, para probar ANTES de tocar Azure):
#   docker compose up -d ollama app     # sin `caddy` — no hay dominio real
#                                        # para pedirle un cert a Let's Encrypt
#                                        # en la laptop; localhost ya es
#                                        # "contexto seguro" para el navegador.
#   # primera vez: entrar al contenedor ollama y autenticarse para el
#   # modelo cloud (misma cuenta que ya usás en local):
#   docker compose exec ollama ollama signin
#   docker compose exec ollama ollama pull moondream
#
# Uso en la VM de demo: `docker compose up -d` (los 3 servicios), con
# DOMAIN seteado en .env — ver .env.example y deploy/RUNBOOK.md. `caddy`
# sirve HTTPS con el nombre DNS de Azure; sin dominio real, el navegador
# bloquea el micrófono (STT) en HTTP sobre IP pública.

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama   # persiste el login de `ollama signin`
    restart: unless-stopped
    # Sin "ports:" a propósito — Ollama NO se expone al host/internet,
    # solo es alcanzable por el servicio `app` dentro de la red interna
    # de compose (ver Fase 3 del plan de despliegue: NSG solo abre 7865).

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - ollama
    # Cualquier variable en .env (USE_AGENTIC_PLANNER, REFINEMENT_MAX_ITERATIONS,
    # etc. — ver config.py) pasa directo al contenedor sin tocar este archivo.
    # `environment:` abajo pisa lo que venga de .env cuando hay conflicto de
    # nombre (por diseño, para las vars que SIEMPRE deben ser fijas acá).
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_HOST: ollama
      OLLAMA_PORT: "11434"
      GRADIO_SERVER: "0.0.0.0"
      GRADIO_PORT: "7865"
      # Credenciales de acceso para expertos tributarios durante la
      # ventana de evaluación — setear vía .env, NUNCA hardcodear acá.
      GRADIO_AUTH_PAIRS: ${GRADIO_AUTH_PAIRS:-}
      # chroma_db/graph_db descargados desde Azure Blob al volumen
      # montado abajo (ver deploy/demo_vm_entrypoint.sh) — no van dentro
      # de la imagen, así el mismo build sirve para cualquier corpus.
      CHROMA_DB_PATH: /app/vector_db/chroma_sri
      GRAPH_DB_PATH: /app/graph_db/sri_graph.json
    volumes:
      - ./vector_db:/app/vector_db
      - ./graph_db:/app/graph_db
      - ./outputs:/app/outputs
    ports:
      # Solo loopback: en la VM de demo el único punto público es `caddy`
      # (80/443). Esto sigue sirviendo para debug local (curl localhost:7865
      # desde adentro de la VM o en el Mac) sin exponer 7865 a internet.
      - "127.0.0.1:7865:7865"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - app
    environment:
      # Nombre DNS que apunta a la IP pública de la VM — el label gratuito
      # de Azure alcanza (ej. sri-tesis-demo.eastus.cloudapp.azure.com,
      # ver deploy/RUNBOOK.md). Sin este valor Caddy no tiene con qué
      # pedir el certificado y el contenedor va a fallar/reintentar —
      # esperado en uso local (no se corre este servicio, ver arriba).
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

volumes:
  ollama_data:
  caddy_data:
  caddy_config:
